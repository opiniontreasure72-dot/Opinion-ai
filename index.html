<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Segoe UI,Arial,sans-serif;
  background:linear-gradient(120deg,#89f7fe,#66a6ff);

body.dark{

header{

  padding:10px 20px;

  align-items:center;

.dark header{

.logo{

}

.container{

}

.card{

  padding:14px;
  border-radius:12px;

}

.dark .card{
  background:#242526;
}

input,textarea{
  width:100%;
  border:1px solid #ddd;
  border-radius:20px;
  padding:11px 15px;
  margin:7px 0;
  background:#f0f2f5;
  outline:none;
  font-family:inherit;
  font-size:15px;
}

.dark input,
.dark textarea{
  background:#3a3b3c;
  border-color:#555;
  color:#fff;
}

input:disabled,textarea:disabled,button:disabled{
  opacity:.6;
  cursor:not-allowed;
}

button{
  border:0;
  padding:9px 16px;
  border-radius:7px;
  background:#1877f2;
  color:white;
  cursor:pointer;
  font-weight:600;
}

button:hover:not(:disabled){
  opacity:.9;
}

.green{
  background:#42b72a;
}

.gray{
  background:#e4e6eb;
  color:#050505;
}

.dark .gray{
  background:#3a3b3c;
  color:#fff;
}

.avatar{
  width:42px;
  height:42px;
  min-width:42px;
  border-radius:50%;
  background:#1877f2;
  color:white;
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:700;
  overflow:hidden;
}

.post-header{

}

.post-img{

}

.post-text{

}

.post-actions{

.dark .post-actions{

.action-btn{

.char-count.over{

.top-actions{

}

#loadingScreen{

  display:flex;
  align-items:center;

#chatbotBtn{

.profile-row{

}

.hidden{

.menu-btn{

<script>

/* =========================================================
   FIREBASE CONFIGURATION
   -----------------------------------------------------------
   Replace these with the values from Firebase Console >
   Project settings > General > Your apps > SDK setup and
   configuration. These values are safe to expose publicly —
   real protection comes from the Firestore/Storage security
   rules (see firestore.rules and storage.rules), NOT from
   hiding this config.
   ========================================================= */

const firebaseConfig = {
  apiKey: "AIzaSyARmDmmyERkOLH2DbBti95Tl0F8crimuHo",
  authDomain: "opinion-df052.firebaseapp.com",
  projectId: "opinion-df052",
  storageBucket: "opinion-df052.firebasestorage.app",
  messagingSenderId: "469030416455",
  appId: "1:469030416455:web:8524b3eb357c6db936c162",
  measurementId: "G-RKM724788Q"
};

firebase.initializeApp(firebaseConfig);

/* Optional but strongly recommended before launch: App Check
   guards your Firebase backend against abuse from scripts that
   aren't your real app. Uncomment and set your reCAPTCHA v3
   site key (Firebase Console > App Check) once configured:

firebase.appCheck().activate(
  "YOUR_RECAPTCHA_V3_SITE_KEY",
  true
);
*/

const auth = firebase.auth();
const db = firebase.firestore();
const storage = firebase.storage();

let currentUser = null;
const MAX_POST_LENGTH = 1000;
const MAX_CHAT_LENGTH = 500;
const MAX_COMMENT_LENGTH = 300;
const MAX_IMAGE_BYTES = 5 * 1024 * 1024;
const BOT_MAX_HISTORY = 12;
const BOT_API_ENDPOINT = "/api/chat"; // Optional secure server endpoint. Never put an AI secret key in this file.
let botBusy = false;
let botHistory = [];


/* =========================================================
   SECURITY / HTML ESCAPING
   ========================================================= */

function escapeHTML(value){
  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}

/* Map raw Firebase error codes to friendlier text without
   leaking implementation details. */
function friendlyError(error){

  const code = error && error.code;

  const map = {
    "auth/invalid-email":"That email address doesn't look right.",
    "auth/user-disabled":"This account has been disabled.",
    "auth/user-not-found":"No account found with that email.",
    "auth/wrong-password":"Incorrect email or password.",
    "auth/invalid-credential":"Incorrect email or password.",
    "auth/email-already-in-use":"An account already exists with that email.",
    "auth/weak-password":"Password must be at least 6 characters.",
    "auth/too-many-requests":"Too many attempts. Please wait a moment and try again.",
    "auth/network-request-failed":"Network error. Check your connection and try again."
  };

  return map[code] || (error && error.message) || "Something went wrong. Please try again.";
}


/* =========================================================
   AUTH
   ========================================================= */

function showError(message){
  $("#authError").text(message || "");
}

$("#signupBtn").click(async function(){

  showError("");

  const email = $("#email").val().trim();
  const password = $("#password").val();
  const confirm = $("#passwordConfirm").val();

  if(!email || !password){
    showError("Enter your email and password.");
    return;
  }

  if(password.length < 6){
    showError("Password must contain at least 6 characters.");
    return;
  }

  // First click reveals the confirm field so users don't
  // accidentally create an account with a typo'd password.
  if($("#passwordConfirm").hasClass("hidden")){
    $("#passwordConfirm").removeClass("hidden").focus();
    return;
  }

  if(password !== confirm){
    showError("Passwords don't match.");
    return;
  }

  $("#signupBtn, #loginBtn, #resetBtn").prop("disabled",true);

  try{
    await auth.createUserWithEmailAndPassword(email,password);
  }catch(error){
    showError(friendlyError(error));
  }finally{
    $("#signupBtn, #loginBtn, #resetBtn").prop("disabled",false);
  }
});


$("#loginBtn").click(async function(){

  showError("");

  const email = $("#email").val().trim();
  const password = $("#password").val();

  if(!email || !password){
    showError("Enter your email and password.");
    return;
  }

  $("#signupBtn, #loginBtn, #resetBtn").prop("disabled",true);

  try{
    await auth.signInWithEmailAndPassword(email,password);
  }catch(error){
    showError(friendlyError(error));
  }finally{
    $("#signupBtn, #loginBtn, #resetBtn").prop("disabled",false);
  }
});


$("#resetBtn").click(async function(){

  showError("");

  const email = $("#email").val().trim();

  if(!email){
    showError("Enter your email first.");
    return;
  }

  $("#signupBtn, #loginBtn, #resetBtn").prop("disabled",true);

  try{
    await auth.sendPasswordResetEmail(email);
    showError("");
    alert("Password reset email sent.");
  }catch(error){
    showError(friendlyError(error));
  }finally{
    $("#signupBtn, #loginBtn, #resetBtn").prop("disabled",false);
  }
});


$("#logoutBtn").click(function(){
  auth.signOut();
});


let unsubscribePosts = null;
let unsubscribeChat = null;

auth.onAuthStateChanged(function(user){

  currentUser = user;

  $("#loadingScreen").addClass("hidden");

  if(user){

    $("#loginBox").addClass("hidden");
    $("#appBox").removeClass("hidden");
    $("#logoutBtn").removeClass("hidden");

    // Reset login form state for next time.
    $("#email,#password,#passwordConfirm").val("");
    $("#passwordConfirm").addClass("hidden");
    showError("");

    const letter =
      (user.email || "Y").charAt(0).toUpperCase();

    $("#userAvatar").text(letter);
    $("#postAvatar").text(letter);

    $("#profileEmail").text(user.email);

    loadPosts();
    loadChat();
    if(window.HappyChatSocial){ HappyChatSocial.ensureProfile().catch(console.warn); startHCSocialUI(); }

  }else{

    $("#loginBox").removeClass("hidden");
    $("#appBox").addClass("hidden");
    $("#logoutBtn").addClass("hidden");

    if(unsubscribePosts){ unsubscribePosts(); unsubscribePosts = null; }
    if(unsubscribeChat){ unsubscribeChat(); unsubscribeChat = null; }

  }

});


/* =========================================================
   CREATE POSTS
   ========================================================= */

$("#postText").on("input",function(){

  const len = $(this).val().length;

  $("#postCharCount")
    .text(len + " / " + MAX_POST_LENGTH)
    .toggleClass("over", len > MAX_POST_LENGTH);

});

$("#postBtn").click(async function(){

  if(!currentUser) return;

  const text = $("#postText").val().trim();
  const file = $("#postImage")[0].files[0];

  if(!text && !file){
    $("#postStatus").html(
      '<div class="error">Write something or select an image.</div>'
    );
    return;
  }

  if(text.length > MAX_POST_LENGTH){
    $("#postStatus").html(

/* =========================================================
   TIME AGO
   ========================================================= */

function timeAgo(timestamp){

  if(!timestamp) return "just now";

  let date;

  try{
    date = timestamp.toDate();
  }catch(e){
    date = new Date();
  }

  const seconds =
    Math.floor(
      (Date.now() - date.getTime()) / 1000
    );

  if(seconds < 60)
    return "just now";

  if(seconds < 3600)
    return Math.floor(seconds / 60) + "m ago";

  if(seconds < 86400)
    return Math.floor(seconds / 3600) + "h ago";

  if(seconds < 2592000)
    return Math.floor(seconds / 86400) + "d ago";

  if(seconds < 31536000)
    return Math.floor(seconds / 2592000) + "mo ago";

  return Math.floor(seconds / 31536000) + "y ago";
}

function botStorageKey(){ return "opinionHistory_" + (currentUser ? currentUser.uid : "guest"); }
function escapeBotHTML(value){ return escapeHTML(value); }

function renderBotText(value){
  let safe=escapeBotHTML(value);
  safe=safe.replace(/\*\*(.+?)\*\*/g,"<strong>$1</strong>");
  safe=safe.replace(/`([^`]+)`/g,"<code>$1</code>");
  safe=safe.replace(/^[-•] (.+)$/gm,"<li>$1</li>");
  safe=safe.replace(/(<li>.*<\/li>\n?)+/g,m=>"<ul>"+m+"</ul>");
  return safe.split(/\n{2,}/).map(x=>"<p>"+x.replace(/\n/g,"<br>")+"</p>").join("");
}
function saveBotHistory(){try{localStorage.setItem(botStorageKey(),JSON.stringify(botHistory.slice(-BOT_MAX_HISTORY)));}catch(e){}}
function loadBotHistory(){
  botHistory=[];
  try{const raw=JSON.parse(localStorage.getItem(botStorageKey())||"[]");if(Array.isArray(raw))botHistory=raw.slice(-BOT_MAX_HISTORY);}catch(e){}
  renderBotHistory();
}
function renderBotHistory(){
  const box=$("#chatbotMessages"); box.empty();
  if(!botHistory.length){
    addBotMessage("Hello! 👋 I'm **Opinion**. I can chat, explain, analyze images and documents, search the web when enabled, and read answers aloud.",false,false);
    return;
  }
  botHistory.forEach(m=>addBotMessage(m.content,m.role==="user",false));
}
function addBotMessage(text,user,remember=true){
  const safe=renderBotText(text);
  $("#chatbotMessages").append(user?`<div class="user-msg">${safe}</div>`:`<div class="bot-msg">${safe}</div>`);
  const box=$("#chatbotMessages")[0];if(box)box.scrollTop=box.scrollHeight;
  if(remember){botHistory.push({role:user?"user":"assistant",content:String(text)});botHistory=botHistory.slice(-BOT_MAX_HISTORY);saveBotHistory();}
}

  $("#chatbotMessages").append('<div id="botTyping" class="bot-msg"><span class="bot-typing"><i></i><i></i><i></i></span></div>');
  const box=$("#chatbotMessages")[0];if(box)box.scrollTop=box.scrollHeight;
}
function hideBotTyping(){$("#botTyping").remove();}

let botAttachment=null;
let botWebSearch=true;
let lastBotAnswer="";

function setAttachment(file){
  botAttachment=file||null;
  const box=$("#botAttachment");
  if(!file){box.hide().empty();return;}
  box.text("Attached: "+file.name+" ("+Math.round(file.size/1024)+" KB)").show();
}

async function fileToDataURL(file){
  return await new Promise((resolve,reject)=>{
    const r=new FileReader();
    r.onload=()=>resolve(String(r.result));
    r.onerror=reject;
    r.readAsDataURL(file);
  });
}

async function askSecureAI(text){
  if(!currentUser) throw new Error("Please sign in first.");
  const token=await currentUser.getIdToken();
  const payload={message:text,history:botHistory.slice(-BOT_MAX_HISTORY),webSearch:botWebSearch};
  if(botAttachment){
    if(botAttachment.size>7*1024*1024) throw new Error("That attachment is too large. Please use a file under 7 MB.");
    const data=await fileToDataURL(botAttachment);
    if(botAttachment.type.startsWith("image/")) payload.imageData=data;
    else payload.fileData=data,payload.fileName=botAttachment.name;
  }
  const response=await fetch(BOT_API_ENDPOINT,{
    method:"POST",
    headers:{"Content-Type":"application/json","Authorization":"Bearer "+token},
    body:JSON.stringify(payload)
  });
  let data={};try{data=await response.json();}catch(e){}
  if(!response.ok)throw new Error(data.error||"Opinion AI service unavailable.");
  return data.reply;
}

async function sendBotMessage(){
  if(botBusy)return;
  const input=$("#botInput"),text=input.val().trim();
  if(!text)return;
  botBusy=true;$("#botSend").prop("disabled",true);input.val("");addBotMessage(text,true);showBotTyping();
  try{
    const answer=await askSecureAI(text);
    hideBotTyping();lastBotAnswer=answer;addBotMessage(answer,false);setAttachment(null);
  }catch(e){
    hideBotTyping();addBotMessage("I couldn't complete that request: "+(e.message||"Please try again."),false);
  }finally{
    botBusy=false;$("#botSend").prop("disabled",false);input.focus();
  }
}

  $('[data-hc-nav="notifications"]').on('click',async()=>{
    const snap=await db.collection('notifications').where('uid','==',currentUser.uid).limit(30).get();
    const rows=snap.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(b.createdAt?.toMillis?.()||0)-(a.createdAt?.toMillis?.()||0));
    const html=rows.length?rows.map(n=>`<div class="hc-row"><div style="flex:1"><b>${escapeHTML(n.actorEmail||'Someone')}</b> ${escapeHTML(n.type||'activity')}<br><small>${n.createdAt?.toDate?n.createdAt.toDate().toLocaleString():''}</small></div>${n.read?'':'<button class="hcMarkRead" data-id="'+escapeHTML(n.id)+'">Mark read</button>'}</div>`).join(''):'<p>No notifications yet.</p>';
    hcOpen('Notifications',html); $('.hcMarkRead').on('click',async function(){await HappyChatSocial.markNotificationRead($(this).data('id'));$(this).closest('.hc-row').remove();});
  });
  if(hcNotificationOff) hcNotificationOff();
  hcNotificationOff=HappyChatSocial.listenNotifications(list=>{const unread=list.filter(x=>!x.read).length; const b=$('[data-hc-nav="notifications"]'); b.attr('title',unread?unread+' unread notifications':'Notifications');});
}
</script>
